<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1B4332">
    <title>Offline — MoneySmart PNG</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #FAFAF7;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }
        .container { max-width: 420px; }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
            border-radius: 16px;
            background: #1B4332;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.75rem;
            font-weight: 700;
        }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; color: #1B4332; }
        p { font-size: 1rem; line-height: 1.6; color: #555; margin-bottom: 1.5rem; }
        button {
            padding: 0.75rem 2rem;
            background: #1B4332;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #2D6A4F; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">M</div>
        <h1>You're offline</h1>
        <p>It looks like you've lost your internet connection. Check your connection and try again.</p>
        <button onclick="window.location.reload()">Try again</button>
    </div>
</body>
</html>
